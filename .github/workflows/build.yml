name: Build My Robot

on:
  workflow_dispatch:

jobs:
  build:
    name: Build 1.8 Inch LCD
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Firmware
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python scripts/build.py bread-compact-wifi-lcd

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: my-1.8-robot-firmware
          path: build/merged-binary.bin
          if-no-files-found: error
